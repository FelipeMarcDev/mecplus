spring.application.name=mecplus

# Banco H2 em arquivo (os dados persistem entre execuções)
spring.datasource.url=jdbc:h2:file:./data/mecplus
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Console do banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
